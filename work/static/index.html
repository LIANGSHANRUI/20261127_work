<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>聊天助手</title>
<style>
  :root{
    color-scheme: light dark;
    --bg:#f4f1ea;
    --surface:#fffdf8;
    --surface-2:#f8f3ea;
    --line:#e7dfd2;
    --line-strong:#d8cdbc;
    --ink:#231f19;
    --muted:#7c7365;
    --accent:#b4442e;
    --accent-2:#8d2f1e;
    --accent-soft:#f7e5de;
    --accent-shadow:rgba(180,68,46,.22);
    --focus-ring:rgba(180,68,46,.14);
    --user-bg:#262019;
    --user-ink:#fff9ef;
    --error:#b23c2c;
    --error-soft:#fdf0ec;
    --warn:#9a6a16;
    --glow-1:rgba(180,68,46,.10);
    --glow-2:rgba(214,169,90,.15);
    --shadow:0 16px 44px rgba(66,48,24,.09);
    --shadow-soft:0 4px 14px rgba(66,48,24,.05);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14120f;
      --surface:#1e1a16;
      --surface-2:#27221d;
      --line:#3a322a;
      --line-strong:#4c4137;
      --ink:#f2ece2;
      --muted:#a59b8c;
      --accent:#e0785c;
      --accent-2:#f09277;
      --accent-soft:#3a261f;
      --accent-shadow:rgba(0,0,0,.35);
      --focus-ring:rgba(224,120,92,.18);
      --user-bg:#e8e0d3;
      --user-ink:#231f19;
      --error:#f08b78;
      --error-soft:#34201c;
      --warn:#d8aa62;
      --glow-1:rgba(224,120,92,.09);
      --glow-2:rgba(197,151,74,.08);
      --shadow:0 18px 50px rgba(0,0,0,.28);
      --shadow-soft:0 4px 16px rgba(0,0,0,.18);
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    overflow:hidden;
    background:
      radial-gradient(900px 520px at 8% -8%,var(--glow-1),transparent 70%),
      radial-gradient(800px 460px at 100% 0%,var(--glow-2),transparent 72%),
      var(--bg);
    color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  button,textarea,input{font:inherit;color:inherit}
  button{cursor:pointer}
  button:focus-visible,textarea:focus-visible,input:focus-visible,dialog:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;
  }
  [hidden]{display:none!important}
  .app{
    width:100%;max-width:900px;height:100dvh;margin:0 auto;
    display:flex;flex-direction:column;padding:0 20px;
  }

  /* 顶栏 */
  .topbar{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    gap:16px;padding:22px 2px 16px;
  }
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .brand-mark{
    flex:0 0 auto;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;
    background:linear-gradient(145deg,var(--accent),var(--accent-2));
    color:#fff;font:600 19px/1 "Songti SC","STSong","SimSun",serif;
    box-shadow:0 8px 20px var(--accent-shadow);
  }
  .brand h1{margin:0;font-size:17px;font-weight:650;letter-spacing:.02em}
  .brand p{margin:2px 0 0;font-size:12px;color:var(--muted);white-space:nowrap}
  .top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .status{
    display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);
    background:var(--surface);border:1px solid var(--line);border-radius:999px;
    padding:6px 11px;max-width:220px;white-space:nowrap;transition:border-color .2s;
  }
  .status #statusText{overflow:hidden;text-overflow:ellipsis}
  .dot{
    flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--muted);
    transition:background .2s,box-shadow .2s;
  }
  .status.online .dot{background:#2f9e6a;box-shadow:0 0 0 3px rgba(47,158,106,.15)}
  .status.offline .dot{background:var(--error);box-shadow:0 0 0 3px rgba(178,60,44,.14)}
  .status.checking .dot{background:#c8a24a;animation:pulse 1.2s ease-in-out infinite}
  .ghost-btn{
    border:1px solid var(--line);background:var(--surface);color:var(--ink);
    border-radius:999px;padding:7px 12px;font-size:12.5px;
    transition:background .2s,border-color .2s,transform .15s;
  }
  .ghost-btn:hover{background:var(--surface-2);border-color:var(--line-strong)}
  .ghost-btn:active{transform:scale(.98)}

  /* 对话区 */
  .chat{
    flex:1 1 auto;display:flex;flex-direction:column;overflow-y:auto;
    overscroll-behavior:contain;scrollbar-gutter:stable both-edges;
    padding:14px 4px 28px;
  }
  .chat::-webkit-scrollbar{width:8px}
  .chat::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px}
  .chat::-webkit-scrollbar-track{background:transparent}
  .messages{display:flex;flex-direction:column;gap:22px}

  /* 空状态 */
  .empty{
    flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px 16px 10px;animation:rise .45s ease both;
  }
  .empty-mark{
    width:74px;height:74px;border-radius:26px;display:grid;place-items:center;
    background:linear-gradient(145deg,var(--accent),var(--accent-2));
    color:#fff;font:600 34px/1 "Songti SC","STSong","SimSun",serif;
    box-shadow:0 18px 40px var(--accent-shadow);
  }
  .eyebrow{
    margin:22px 0 0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--accent);font-weight:750;
  }
  .empty h2{
    font-family:"Songti SC","STSong","SimSun",serif;
    font-weight:600;font-size:clamp(26px,4vw,34px);letter-spacing:.02em;
    margin:10px 0 8px;
  }
  .empty-copy{margin:0;max-width:32em;color:var(--muted);font-size:14px;line-height:1.8}
  .suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:24px}
  .suggestion{
    border:1px solid var(--line);background:var(--surface);border-radius:999px;
    padding:8px 14px;font-size:13px;color:var(--ink);
    transition:transform .15s,box-shadow .2s,border-color .2s;
  }
  .suggestion:hover{
    transform:translateY(-1px);border-color:var(--line-strong);
    box-shadow:var(--shadow-soft);
  }
  .suggestion:active{transform:translateY(0) scale(.99)}

  /* 消息 */
  .msg{display:flex;align-items:flex-start;gap:10px;animation:rise .3s ease both}
  .msg.user{flex-direction:row-reverse}
  .msg-main{display:flex;flex-direction:column;gap:6px;min-width:0;max-width:min(76ch,82%)}
  .msg.user .msg-main{align-items:flex-end}
  .avatar{
    flex:0 0 auto;width:32px;height:32px;border-radius:11px;display:grid;place-items:center;
    margin-top:2px;font-size:12px;font-weight:750;border:1px solid var(--line);
    background:var(--surface);color:var(--muted);user-select:none;
  }
  .msg.assistant .avatar{background:var(--accent-soft);color:var(--accent-2);border-color:transparent}
  .msg.user .avatar{background:var(--user-bg);color:var(--user-ink);border-color:transparent}
  .bubble{
    padding:12px 16px;border-radius:18px;font-size:14.5px;line-height:1.8;
    overflow-wrap:anywhere;
  }
  .msg.assistant .bubble{
    background:var(--surface);border:1px solid var(--line);
    border-top-left-radius:6px;box-shadow:var(--shadow-soft);
  }
  .msg.user .bubble{
    background:var(--user-bg);color:var(--user-ink);border-top-right-radius:6px;
  }
  .msg.assistant .bubble.error{border-color:rgba(178,60,44,.5);background:var(--error-soft)}
  .content{white-space:pre-wrap;word-break:break-word}
  .typing{display:inline-flex;align-items:center;gap:4px;padding:5px 0}
  .typing i{
    width:5px;height:5px;border-radius:50%;background:var(--muted);
    animation:blink 1.2s ease-in-out infinite;
  }
  .typing i:nth-child(2){animation-delay:.15s}
  .typing i:nth-child(3){animation-delay:.3s}
  .msg.streaming .content::after{
    content:"";display:inline-block;width:2px;height:1em;margin-left:3px;
    vertical-align:-2px;background:var(--accent);animation:caret .9s step-end infinite;
  }
  .msg-tools{display:flex;align-items:center;gap:10px;min-height:18px;padding:0 4px}
  .msg.user .msg-tools{justify-content:flex-end}
  .meta{font-size:11px;color:var(--muted)}
  .copy{
    border:0;background:none;padding:0;font-size:11px;color:var(--muted);
    opacity:0;transition:opacity .2s,color .2s;
  }
  .msg:hover .copy,.copy:focus-visible{opacity:1}
  .copy:hover{color:var(--accent)}
  .notice{font-size:12px;line-height:1.6;color:var(--muted);padding:0 4px}
  .notice.error{color:var(--error)}
  .notice.warn{color:var(--warn)}

  /* 输入区 */
  .composer-wrap{flex:0 0 auto;padding:8px 0 max(14px,env(safe-area-inset-bottom))}
  .composer{
    display:flex;align-items:flex-end;gap:10px;background:var(--surface);
    border:1px solid var(--line);border-radius:20px;padding:10px 10px 10px 16px;
    box-shadow:var(--shadow);transition:border-color .2s,box-shadow .2s;
  }
  .composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--focus-ring),var(--shadow)}
  .composer textarea{
    flex:1;min-height:28px;max-height:160px;border:0;background:transparent;
    resize:none;outline:0;padding:5px 0;line-height:1.65;font-size:14.5px;
  }
  .composer textarea::placeholder{color:var(--muted)}
  .send-btn{
    flex:0 0 auto;width:44px;height:44px;border:0;border-radius:14px;
    background:var(--accent);color:#fff;display:grid;place-items:center;
    box-shadow:0 8px 18px var(--accent-shadow);
    transition:transform .15s,filter .2s,background .2s,color .2s;
  }
  .send-btn:hover{filter:brightness(1.05);transform:translateY(-1px)}
  .send-btn:active{transform:translateY(0) scale(.97)}
  .send-btn svg{width:19px;height:19px;display:block}
  .send-btn .stop-icon{display:none}
  body.busy .send-btn{background:var(--user-bg);color:var(--user-ink);box-shadow:none}
  body.busy .send-btn .send-icon{display:none}
  body.busy .send-btn .stop-icon{display:block}
  .foot{
    display:flex;justify-content:space-between;gap:12px;padding:8px 6px 0;
    font-size:11.5px;color:var(--muted);
  }
  .foot .err{color:var(--error)}

  /* 参数弹窗 */
  dialog{
    margin:auto;width:min(560px,calc(100vw - 28px));max-height:calc(100dvh - 40px);
    border:1px solid var(--line);border-radius:22px;background:var(--surface);
    color:var(--ink);padding:0;box-shadow:0 30px 80px rgba(0,0,0,.28);
    overflow:auto;
  }
  dialog::backdrop{background:rgba(22,17,12,.42);backdrop-filter:blur(4px)}
  .settings{padding:22px}
  .settings-head{
    display:flex;justify-content:space-between;align-items:flex-start;
    gap:16px;margin-bottom:20px;
  }
  .settings-head h2{margin:0;font-size:17px}
  .settings-head p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
  .close-x{
    flex:0 0 auto;width:32px;height:32px;border:0;border-radius:50%;
    background:var(--surface-2);color:var(--muted);font-size:20px;line-height:1;
  }
  .close-x:hover{color:var(--ink)}
  .field{margin-bottom:19px}
  .field-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .field label{display:block;font-size:13px;font-weight:650;margin-bottom:3px}
  .help{margin:4px 0 9px;font-size:12px;line-height:1.6;color:var(--muted)}
  .range-val{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  #systemInput{
    width:100%;min-height:94px;border:1px solid var(--line);border-radius:14px;
    background:var(--bg);padding:10px 12px;resize:vertical;
    font-size:13.5px;line-height:1.7;
  }
  input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer}
  .settings-actions{
    display:flex;justify-content:space-between;gap:12px;
    border-top:1px solid var(--line);padding-top:16px;
  }
  .btn-secondary,.btn-primary{
    border:0;border-radius:11px;padding:10px 16px;font-size:13px;
    transition:filter .2s,background .2s;
  }
  .btn-secondary{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
  .btn-secondary:hover{border-color:var(--line-strong)}
  .btn-primary{background:var(--accent);color:#fff;box-shadow:0 8px 18px var(--accent-shadow)}
  .btn-primary:hover{filter:brightness(1.05)}

  /* 提示 */
  .toast{
    position:fixed;left:50%;bottom:112px;z-index:50;max-width:min(90vw,420px);
    transform:translate(-50%,12px);opacity:0;pointer-events:none;
    background:var(--ink);color:var(--bg);border-radius:999px;
    padding:9px 16px;font-size:12.5px;text-align:center;
    transition:opacity .25s,transform .25s;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-2px)}}
  @keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes pulse{0%,100%{opacity:.45;transform:scale(.9)}50%{opacity:1;transform:scale(1)}}

  @media (max-width:640px){
    .app{padding:0 12px}
    .topbar{padding:14px 2px 10px;gap:10px}
    .brand-mark{width:38px;height:38px;border-radius:12px;font-size:17px}
    .brand h1{font-size:16px}
    .brand p{display:none}
    .top-actions{gap:6px}
    .status{padding:5px 9px;max-width:148px}
    .ghost-btn{padding:6px 10px;font-size:12px}
    .chat{padding:10px 0 20px}
    .msg-main{max-width:88%}
    .empty h2{font-size:28px}
    .composer{padding:8px 8px 8px 13px;border-radius:18px}
    .send-btn{width:42px;height:42px;border-radius:13px}
    .foot span:last-child{display:none}
    .toast{bottom:98px}
  }
  @media (hover:none){.copy{opacity:.7}}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
      animation-duration:.01ms!important;animation-iteration-count:1!important;
      transition-duration:.01ms!important;
    }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">聊</div>
      <div class="brand-text">
        <h1>聊天助手</h1>
        <p>郭德纲风格 · 接得住梗</p>
      </div>
    </div>
    <div class="top-actions">
      <span class="status checking" id="status" title="服务状态">
        <span class="dot" aria-hidden="true"></span>
        <span id="statusText">连接中…</span>
      </span>
      <button class="ghost-btn" id="settingsBtn" type="button">参数</button>
      <button class="ghost-btn" id="clearBtn" type="button">清空</button>
    </div>
  </header>

  <main class="chat" id="chat">
    <section class="empty" id="empty">
      <div class="empty-mark" aria-hidden="true">聊</div>
      <p class="eyebrow">在线 · 幽默模式</p>
      <h2>来，聊五块钱的。</h2>
      <p class="empty-copy">我走的是郭德纲的路子：正经话也能说，但尽量不让你觉得无聊。问点什么都行。</p>
      <div class="suggestions" aria-label="试试这样问">
        <button class="suggestion" type="button" data-prompt="用一句话介绍你自己">用一句话介绍你自己</button>
        <button class="suggestion" type="button" data-prompt="讲个冷笑话，别太冷">讲个冷笑话</button>
        <button class="suggestion" type="button" data-prompt="帮我写一首关于大雾的诗">写一首关于大雾的诗</button>
        <button class="suggestion" type="button" data-prompt="推荐一部适合周末看的电影，并说说理由">推荐一部周末电影</button>
      </div>
    </section>
    <div class="messages" id="messages" aria-busy="false"></div>
  </main>

  <footer class="composer-wrap">
    <form class="composer" id="composer" autocomplete="off">
      <textarea id="input" rows="1" maxlength="8000" placeholder="说点什么…" aria-label="消息"></textarea>
      <button class="send-btn" id="sendBtn" type="button" aria-label="发送">
        <svg class="send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 19V5"/><path d="m5 12 7-7 7 7"/>
        </svg>
        <svg class="stop-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <rect x="7" y="7" width="10" height="10" rx="2"/>
        </svg>
      </button>
    </form>
    <div class="foot">
      <span>Enter 发送 · Shift + Enter 换行</span>
      <span id="footHint">API Key 仅保存在服务端</span>
    </div>
  </footer>
</div>

<dialog id="settingsDialog" aria-labelledby="settingsTitle">
  <div class="settings">
    <div class="settings-head">
      <div>
        <h2 id="settingsTitle">对话参数</h2>
        <p>修改只影响之后发送的消息</p>
      </div>
      <button class="close-x" id="closeSettings" type="button" aria-label="关闭">×</button>
    </div>

    <div class="field">
      <label for="systemInput">系统提示词</label>
      <p class="help">设定助手的性格和说话方式；清空则使用默认人设。</p>
      <textarea id="systemInput" rows="4" maxlength="4000"></textarea>
    </div>

    <div class="field">
      <div class="field-row">
        <label for="tempInput">temperature</label>
        <span class="range-val" id="tempVal">1.2</span>
      </div>
      <p class="help">越高越随机、越发散；越低越稳定。</p>
      <input id="tempInput" type="range" min="0" max="2" step="0.1" value="1.2">
    </div>

    <div class="field">
      <div class="field-row">
        <label for="topPInput">top_p</label>
        <span class="range-val" id="topPVal">0.90</span>
      </div>
      <p class="help">控制采样范围；一般与 temperature 配合微调。</p>
      <input id="topPInput" type="range" min="0" max="1" step="0.05" value="0.9">
    </div>

    <div class="settings-actions">
      <button class="btn-secondary" id="resetSettings" type="button">恢复默认</button>
      <button class="btn-primary" id="saveSettings" type="button">完成</button>
    </div>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  "use strict";

  const DEFAULT_SETTINGS = {
    system: "你是一个聊天助手，你的语言风格很幽默，可以参考郭德纲的语言风格，可以适当使用网络流行语",
    temperature: 1.2,
    top_p: 0.9,
  };
  const SETTINGS_KEY = "chat-web-settings-v1";
  const MAX_CLIENT_HISTORY = 40;

  const chatEl = document.getElementById("chat");
  const messagesEl = document.getElementById("messages");
  const emptyEl = document.getElementById("empty");
  const inputEl = document.getElementById("input");
  const composerEl = document.getElementById("composer");
  const sendBtn = document.getElementById("sendBtn");
  const statusEl = document.getElementById("status");
  const statusTextEl = document.getElementById("statusText");
  const footHintEl = document.getElementById("footHint");
  const settingsDialog = document.getElementById("settingsDialog");
  const systemInput = document.getElementById("systemInput");
  const tempInput = document.getElementById("tempInput");
  const topPInput = document.getElementById("topPInput");
  const tempVal = document.getElementById("tempVal");
  const topPVal = document.getElementById("topPVal");
  const toastEl = document.getElementById("toast");

  const state = {
    history: [],
    busy: false,
    controller: null,
    session: 0,
  };
  let settings = loadSettings();
  let stickToBottom = true;
  let toastTimer = 0;

  function clamp(value, min, max) {
    return Math.min(max, Math.max(min, value));
  }

  function loadSettings() {
    try {
      const raw = localStorage.getItem(SETTINGS_KEY);
      if (!raw) return { ...DEFAULT_SETTINGS };
      const saved = JSON.parse(raw);
      return {
        system: typeof saved.system === "string" ? saved.system : DEFAULT_SETTINGS.system,
        temperature: Number.isFinite(Number(saved.temperature))
          ? clamp(Number(saved.temperature), 0, 2)
          : DEFAULT_SETTINGS.temperature,
        top_p: Number.isFinite(Number(saved.top_p))
          ? clamp(Number(saved.top_p), 0, 1)
          : DEFAULT_SETTINGS.top_p,
      };
    } catch {
      return { ...DEFAULT_SETTINGS };
    }
  }

  function persistSettings(next) {
    settings = next;
    try {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(next));
    } catch {
      /* 隐私模式等场景下忽略存储失败 */
    }
  }

  function syncSettingsForm() {
    systemInput.value = settings.system;
    tempInput.value = String(settings.temperature);
    topPInput.value = String(settings.top_p);
    tempVal.textContent = Number(tempInput.value).toFixed(1);
    topPVal.textContent = Number(topPInput.value).toFixed(2);
  }

  function settingsFromForm() {
    return {
      system: systemInput.value.trim(),
      temperature: clamp(Number(tempInput.value) || 0, 0, 2),
      top_p: clamp(Number(topPInput.value) || 0, 0, 1),
    };
  }

  function setStatus(kind, text) {
    statusEl.className = "status " + kind;
    statusTextEl.textContent = text;
  }

  function showToast(message) {
    toastEl.textContent = message;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = window.setTimeout(() => toastEl.classList.remove("show"), 2200);
  }

  function resizeInput() {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
  }

  function atBottom() {
    return chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight < 140;
  }

  function scrollToBottom(force = false) {
    if (force || stickToBottom) {
      chatEl.scrollTop = chatEl.scrollHeight;
    }
  }

  chatEl.addEventListener("scroll", () => {
    stickToBottom = atBottom();
  }, { passive: true });

  function setBusy(busy) {
    state.busy = busy;
    document.body.classList.toggle("busy", busy);
    messagesEl.setAttribute("aria-busy", busy ? "true" : "false");
    sendBtn.setAttribute("aria-label", busy ? "停止生成" : "发送");
    inputEl.placeholder = busy ? "正在生成，点右侧停止…" : "说点什么…";
  }

  function addNotice(main, text, kind = "") {
    const notice = document.createElement("div");
    notice.className = "notice" + (kind ? " " + kind : "");
    notice.textContent = text;
    main.appendChild(notice);
    return notice;
  }

  function createMessage(role, text = "") {
    const article = document.createElement("article");
    article.className = "msg " + role;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "我" : "助";
    avatar.setAttribute("aria-hidden", "true");

    const main = document.createElement("div");
    main.className = "msg-main";

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    const content = document.createElement("div");
    content.className = "content";
    if (text) content.textContent = text;
    bubble.appendChild(content);

    const tools = document.createElement("div");
    tools.className = "msg-tools";
    const meta = document.createElement("span");
    meta.className = "meta";
    meta.textContent = role === "user" ? "我" : "助手";
    tools.appendChild(meta);

    let typing = null;
    let copyBtn = null;
    if (role === "assistant") {
      if (!text) {
        article.classList.add("pending");
        typing = document.createElement("span");
        typing.className = "typing";
        typing.setAttribute("aria-label", "正在输入");
        typing.innerHTML = "<i></i><i></i><i></i>";
        content.appendChild(typing);
      }
      copyBtn = document.createElement("button");
      copyBtn.type = "button";
      copyBtn.className = "copy";
      copyBtn.textContent = "复制";
      copyBtn.setAttribute("aria-label", "复制这条回答");
      copyBtn.addEventListener("click", async () => {
        const ok = await copyText(content.textContent);
        copyBtn.textContent = ok ? "已复制" : "复制失败";
        window.setTimeout(() => { copyBtn.textContent = "复制"; }, 1500);
      });
      tools.appendChild(copyBtn);
    }

    main.append(bubble, tools);
    if (role === "user") {
      article.append(main, avatar);
    } else {
      article.append(avatar, main);
    }
    messagesEl.appendChild(article);

    return { article, main, bubble, content, meta, typing, copyBtn };
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch {
      try {
        const helper = document.createElement("textarea");
        helper.value = text;
        helper.style.cssText = "position:fixed;top:-9999px;left:-9999px;opacity:0";
        document.body.appendChild(helper);
        helper.select();
        const ok = document.execCommand("copy");
        helper.remove();
        return ok;
      } catch {
        return false;
      }
    }
  }

  async function readSSE(response, onEvent) {
    const reader = response.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buffer = "";

    const dispatch = (frame) => {
      const dataLines = frame
        .split(/\r?\n/)
        .filter((line) => line.startsWith("data:"));
      if (!dataLines.length) return;
      const raw = dataLines.map((line) => line.slice(5).trimStart()).join("\n");
      let payload;
      try {
        payload = JSON.parse(raw);
      } catch {
        return;
      }
      onEvent(payload);
    };

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let boundary;
      while ((boundary = buffer.indexOf("\n\n")) !== -1) {
        const frame = buffer.slice(0, boundary);
        buffer = buffer.slice(boundary + 2);
        dispatch(frame);
      }
    }
    buffer += decoder.decode();
    if (buffer.trim()) dispatch(buffer);
  }

  async function responseError(response) {
    const raw = await response.text();
    try {
      const data = JSON.parse(raw);
      if (data && data.detail) {
        return typeof data.detail === "string"
          ? data.detail
          : JSON.stringify(data.detail);
      }
    } catch {
      /* 不是 JSON，直接使用原文 */
    }
    return raw || ("HTTP " + response.status);
  }

  function friendlyError(message) {
    const text = String(message || "未知错误").replace(/\s+/g, " ").trim();
    return text.length > 280 ? text.slice(0, 280) + "…" : text;
  }

  function pushHistory(userText, assistantText) {
    state.history.push(
      { role: "user", content: userText },
      { role: "assistant", content: assistantText }
    );
    if (state.history.length > MAX_CLIENT_HISTORY) {
      state.history = state.history.slice(-MAX_CLIENT_HISTORY);
    }
  }

  function abortGeneration() {
    if (state.controller) state.controller.abort();
  }

  async function sendMessage() {
    if (state.busy) return;
    const text = inputEl.value.trim();
    if (!text) {
      inputEl.focus();
      return;
    }

    const sessionAtStart = state.session;
    inputEl.value = "";
    resizeInput();
    emptyEl.hidden = true;
    createMessage("user", text);
    const bot = createMessage("assistant");
    stickToBottom = true;
    scrollToBottom(true);

    const requestHistory = state.history.slice(-MAX_CLIENT_HISTORY);
    const controller = new AbortController();
    state.controller = controller;
    setBusy(true);

    let full = "";
    let gotDelta = false;
    let finished = false;
    let aborted = false;
    let failure = "";

    try {
      const response = await fetch("/api/chat/stream", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Accept": "text/event-stream",
        },
        body: JSON.stringify({
          message: text,
          system: settings.system,
          history: requestHistory,
          temperature: settings.temperature,
          top_p: settings.top_p,
        }),
        signal: controller.signal,
      });

      if (!response.ok) {
        throw new Error(await responseError(response));
      }
      if (!response.body) {
        throw new Error("当前浏览器不支持流式读取。");
      }

      await readSSE(response, (event) => {
        if (event.type === "delta" && typeof event.text === "string") {
          if (!gotDelta) {
            gotDelta = true;
            bot.article.classList.remove("pending");
            bot.article.classList.add("streaming");
            if (bot.typing) {
              bot.typing.remove();
              bot.typing = null;
            }
          }
          full += event.text;
          bot.content.textContent = full;
          scrollToBottom();
        } else if (event.type === "error") {
          throw new Error(event.message || "模型调用失败");
        } else if (event.type === "done") {
          finished = true;
        }
      });

      if (!finished && !controller.signal.aborted) {
        addNotice(bot.main, "连接提前结束，回答可能不完整。", "warn");
      }
    } catch (error) {
      if (error && error.name === "AbortError") {
        aborted = true;
        if (!full) bot.content.textContent = "（已停止）";
        addNotice(bot.main, "已停止生成", "");
      } else {
        failure = error instanceof Error ? error.message : String(error);
        bot.bubble.classList.add("error");
        if (!full) bot.content.textContent = "这次没接上话。";
        addNotice(bot.main, "请求失败：" + friendlyError(failure), "error");
      }
    } finally {
      bot.article.classList.remove("pending", "streaming");
      if (bot.typing) {
        bot.typing.remove();
        bot.typing = null;
      }
      state.controller = null;
      setBusy(false);

      if (sessionAtStart === state.session) {
        if (full.trim()) {
          pushHistory(text, full);
        } else if (!failure && !gotDelta && !aborted) {
          bot.content.textContent = "（模型没有返回内容，请再试一次）";
        }
      }

      scrollToBottom();
      if (window.matchMedia("(pointer: fine)").matches) {
        inputEl.focus({ preventScroll: true });
      }
    }
  }

  function clearChat() {
    if (!messagesEl.children.length) {
      inputEl.focus();
      return;
    }
    state.session += 1;
    abortGeneration();
    state.history = [];
    messagesEl.replaceChildren();
    emptyEl.hidden = false;
    stickToBottom = true;
    chatEl.scrollTop = 0;
    showToast("对话已清空");
    if (window.matchMedia("(pointer: fine)").matches) {
      inputEl.focus({ preventScroll: true });
    }
  }

  async function checkHealth() {
    setStatus("checking", "连接中…");
    try {
      const response = await fetch("/api/health", { cache: "no-store" });
      if (!response.ok) throw new Error("HTTP " + response.status);
      const data = await response.json();
      if (data.key_configured) {
        setStatus("online", data.model || "已连接");
        footHintEl.textContent = "模型 " + (data.model || "已配置") + " · Key 仅保存在服务端";
        footHintEl.classList.remove("err");
      } else {
        setStatus("offline", "未配置 Key");
        footHintEl.textContent = "后端未配置 CHAT_API_KEY，请检查 work/.env";
        footHintEl.classList.add("err");
      }
    } catch {
      setStatus("offline", "服务未连接");
      footHintEl.textContent = "无法连接后端，请确认 FastAPI 已启动";
      footHintEl.classList.add("err");
    }
  }

  composerEl.addEventListener("submit", (event) => {
    event.preventDefault();
    if (!state.busy) sendMessage();
  });

  sendBtn.addEventListener("click", () => {
    if (state.busy) abortGeneration();
    else sendMessage();
  });

  inputEl.addEventListener("input", resizeInput);
  inputEl.addEventListener("keydown", (event) => {
    if (event.key !== "Enter" || event.shiftKey || event.isComposing || event.keyCode === 229) {
      return;
    }
    event.preventDefault();
    if (!state.busy) sendMessage();
  });

  document.querySelectorAll(".suggestion").forEach((button) => {
    button.addEventListener("click", () => {
      const prompt = button.dataset.prompt || button.textContent || "";
      inputEl.value = prompt;
      resizeInput();
      if (!state.busy) sendMessage();
    });
  });

  document.getElementById("settingsBtn").addEventListener("click", () => {
    syncSettingsForm();
    settingsDialog.showModal();
  });

  document.getElementById("closeSettings").addEventListener("click", () => {
    settingsDialog.close();
  });

  document.getElementById("saveSettings").addEventListener("click", () => {
    persistSettings(settingsFromForm());
    settingsDialog.close();
    showToast("参数已保存");
  });

  document.getElementById("resetSettings").addEventListener("click", () => {
    systemInput.value = DEFAULT_SETTINGS.system;
    tempInput.value = String(DEFAULT_SETTINGS.temperature);
    topPInput.value = String(DEFAULT_SETTINGS.top_p);
    tempVal.textContent = DEFAULT_SETTINGS.temperature.toFixed(1);
    topPVal.textContent = DEFAULT_SETTINGS.top_p.toFixed(2);
  });

  tempInput.addEventListener("input", () => {
    tempVal.textContent = Number(tempInput.value).toFixed(1);
  });

  topPInput.addEventListener("input", () => {
    topPVal.textContent = Number(topPInput.value).toFixed(2);
  });

  document.getElementById("clearBtn").addEventListener("click", clearChat);

  settingsDialog.addEventListener("click", (event) => {
    if (event.target === settingsDialog) settingsDialog.close();
  });

  syncSettingsForm();
  resizeInput();
  checkHealth();
  if (window.matchMedia("(pointer: fine)").matches) {
    window.setTimeout(() => inputEl.focus({ preventScroll: true }), 60);
  }
})();
</script>
</body>
</html>
